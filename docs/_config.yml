# Built by scripts/build_docs.py. Do not edit docs/ by hand: it is
# regenerated from the canonical files and a test checks it matches.
title: N-DOS
description: >-
  A shared language for animal neuroscience data, and the tooling
  that makes following it practical.
# No theme: the layout, the stylesheet and the fonts are in site/
# and are copied here. A themed site looks like the theme.
plugins: [jekyll-seo-tag]
exclude: [README.md]
include: [schemas]

# Jekyll's SEO tag builds the link preview from these. Without an
# absolute url it cannot, and a posted link renders as a bare URL.
url: https://elnazkarami.github.io
baseurl: /N-DOS
twitter:
  card: summary_large_image
defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/social-card.png

name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # NDOS Core is standard library only, by design: a lab should be able to
      # run it on an acquisition machine without an install step. jsonschema is
      # a test-only dependency used to check manifests against the published
      # schema; the suite skips those checks if it is absent.
      - name: Install test-only dependencies
        run: python -m pip install --upgrade pip jsonschema

      - name: Run tests
        run: python -m unittest discover -s tests -v

  no-runtime-dependencies:
    name: verify stdlib-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Deliberately no pip install: the modules must import and run against a
      # bare interpreter. If this job fails, a dependency crept in.
      - name: Import and run every module with no packages installed
        run: |
          python -c "import ndos_scan, ndos_init, ndos_report, ndos_table, ndos_query, ndos_prov, ndos_archive, ndos_organize"
          python ndos_scan.py --help
          python ndos_init.py --help
          python ndos_report.py --help
          python ndos_table.py --help
          python ndos_query.py --help
          python ndos_prov.py --help
          python ndos_archive.py --help
          python ndos_organize.py --help

      - name: End-to-end run on the synthetic fixture
        run: |
          python tests/fixtures/make_messy_lab.py /tmp/messy-lab --force
          python ndos_scan.py /tmp/messy-lab --output /tmp/manifest.json
          python ndos_report.py /tmp/manifest.json --format markdown -o /tmp/report.md
          cat /tmp/report.md
          python ndos_table.py export /tmp/manifest.json -d /tmp/metadata
          # --include-empty keeps rows that have no hand-entered metadata, so
          # the query below has observed evidence to actually match against.
          python ndos_table.py check /tmp/metadata --emit /tmp/linked.json --include-empty
          python ndos_query.py /tmp/linked.json -w 'modalities~electrophysiology' -w 'file_count>=2'
          # Provenance round trip: wrap a command, then trace its output back.
          python ndos_prov.py run -d /tmp/prov -i /tmp/manifest.json -o /tmp/derived \
            -- python -c "import pathlib;d=pathlib.Path('/tmp/derived');d.mkdir(exist_ok=True);(d/'r.txt').write_text('x')"
          python ndos_prov.py list -d /tmp/prov
          python ndos_prov.py trace /tmp/derived/r.txt -d /tmp/prov
          # Archive round trip: catalogue without extracting, then plan.
          python ndos_archive.py inspect /tmp/messy-lab -c /tmp/archives.json
          python ndos_archive.py search /tmp/archives.json '*.avi'
          python ndos_archive.py plan /tmp/archives.json --dest /tmp/unpacked --name '*.avi'
          # Rebuild the N-DOS layout, then undo it, leaving the source untouched.
          python ndos_organize.py plan /tmp/manifest.json -d /tmp/project
          python ndos_organize.py apply /tmp/manifest.json -d /tmp/project --yes
          test -d /tmp/project/raw_data && test -f /tmp/project/README.md
          python ndos_organize.py undo /tmp/project/.ndos-layout-log.json --yes

  schema:
    name: validate schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip check-jsonschema
      - name: Check every schema is itself a valid JSON Schema
        run: check-jsonschema --check-metaschema schemas/*.json
